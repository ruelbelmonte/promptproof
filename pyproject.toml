[project]
name = "promptproof"
version = "0.1.0"
description = "A red-team harness that tests whether an LLM system resists prompt injection"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1", "mypy==2.4.0"]

[project.scripts]
promptproof = "promptproof.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
